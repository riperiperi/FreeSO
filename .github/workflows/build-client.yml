name: Build Client

on:
  push:
    branches: [ master, dev ]
    paths:
      # Client-only projects
      - 'TSOClient/FSO.IDE/**'
      - 'TSOClient/FSO.Windows/**'
      - 'TSOClient/FSO.UI/**'
      - 'TSOClient/FSO.SimAntics.JIT/**'
      - 'TSOClient/FSO.SimAntics.JIT.Roslyn/**'
      - 'TSOClient/FSO.Patcher/**'
      - 'TSOClient/tso.client/**'
      - 'TSOClient/tso.sound/**'
      - 'TSOClient/tso.debug/**'
      - 'Other/libs/FSOMonoGame/**'
      # Shared projects (used by both builds)
      - 'TSOClient/tso.common/**'
      - 'TSOClient/tso.content/**'
      - 'TSOClient/tso.files/**'
      - 'TSOClient/tso.simantics/**'
      - 'TSOClient/tso.vitaboy.model/**'
      - 'TSOClient/tso.world/**'
      - 'Other/libs/TargaImagePCL/**'
      # Solution / build config
      - 'TSOClient/FreeSO.sln'
      - 'TSOClient/Directory.Build.props'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.5 targeting pack
        run: choco install netfx-4.5-devpack -y --no-progress --ignore-checksums

      - name: Run Protobuild
        working-directory: Other/libs/FSOMonoGame
        run: .\protobuild.exe --generate
        continue-on-error: true

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore TSOClient/FreeSO.sln

      - name: Build client (FSO.IDE)
        run: |
          msbuild TSOClient/FreeSO.sln `
            /t:FSO_IDE `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:OutDir="${{ github.workspace }}\publish\client"

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeso-client-windows-ogl
          path: publish/client/
          retention-days: 30

      - name: Zip client for release
        if: github.ref == 'refs/heads/master'
        run: Compress-Archive -Path publish\client\* -DestinationPath publish\freeso-client-windows-ogl.zip

      - name: Collect macOS native libraries (macextras)
        if: github.ref == 'refs/heads/master'
        run: |
          $libs = Get-ChildItem -Recurse "Other\libs\FSOMonoGame" -Include "*.dylib" -ErrorAction SilentlyContinue
          if ($libs) {
            New-Item -ItemType Directory -Force -Path "publish\macextras" | Out-Null
            $libs | Copy-Item -Destination "publish\macextras\"
            Compress-Archive -Path "publish\macextras\*" -DestinationPath "publish\macextras.zip"
            Write-Host "Packaged $($libs.Count) dylib file(s) into macextras.zip"
            echo "HAS_MACEXTRAS=true" >> $env:GITHUB_ENV
          } else {
            Write-Host "No .dylib files found in FSOMonoGame — skipping macextras"
            echo "HAS_MACEXTRAS=false" >> $env:GITHUB_ENV
          }

      - name: Publish GitHub Release — with macextras (master only)
        if: github.ref == 'refs/heads/master' && env.HAS_MACEXTRAS == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-client
          name: Latest Client Build
          prerelease: true
          files: |
            publish/freeso-client-windows-ogl.zip
            publish/macextras.zip

      - name: Publish GitHub Release — no macextras (master only)
        if: github.ref == 'refs/heads/master' && env.HAS_MACEXTRAS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-client
          name: Latest Client Build
          prerelease: true
          files: publish/freeso-client-windows-ogl.zip