name: Build Server

on:
  push:
    branches: [ master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore TSOClient/FreeSO.sln

      - name: Restore SDK packages
        run: |
          dotnet restore TSOClient/FSO.Server.Core/FSO.Server.Core.csproj `
            -r linux-x64

      - name: Publish server
        run: |
          dotnet publish TSOClient/FSO.Server.Core/FSO.Server.Core.csproj `
            -c Release `
            -r linux-x64 `
            --self-contained true `
            --no-restore `
            /p:Platform=AnyCPU `
            -o publish/server

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeso-server-linux-x64
          path: publish/server/
          retention-days: 90

      - name: Zip server for release
        if: github.ref == 'refs/heads/master'
        run: Compress-Archive -Path publish\server\* -DestinationPath publish\freeso-server-linux-x64.zip

      - name: Publish GitHub Release (master only)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-server
          name: Latest Server Build
          prerelease: true
          files: publish/freeso-server-linux-x64.zip
