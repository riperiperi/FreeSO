<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FreeSO Browser</title>
    <base href="./" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="FSO.BrowserClient.styles.css" rel="stylesheet" />
</head>

<body>

    <div id="app">
        <div id="loading" style="display: table-cell; margin: auto; width:100vw; height:100vh; vertical-align: middle; background: #0f1220;">
            <div style="display: block; margin: auto; width: 12em; color: #e6e8f0;font-family: 'Segoe UI', sans-serif;">
                <div style="text-align: center; font-size: 1.2em; color: #8caaff; margin-bottom: 0.6em;">FreeSO Browser</div>
                <div style="text-align: center; font-size: 0.85em; opacity: 0.7;">KNI / BlazorGL spike<br/><a href="https://github.com/kniEngine/kni"><img src="kni.png" border="0" alt="Kni"></a></div>
                <div style="text-align: center; font-size: 1.4em; margin-top: 0.8em;">loading&nbsp;<marquee style="width:0.9em; vertical-align: bottom;">.&nbsp;.&nbsp;.&nbsp;&nbsp;&nbsp;</marquee></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';
        window.BrotliDecode = BrotliDecode;
        // Set this to enable Brotli (.br) decompression on static webServers
        // that don't support content compression and http://.
        var enableBrotliDecompression = false;
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity)
            {
                if (enableBrotliDecompression === true && type !== 'dotnetjs' && location.hostname !== 'localhost')
                {
                    return (async function()
                    {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok)
                            throw new Error(response.statusText);
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const contentType = (type === 'dotnetwasm')
                                          ? 'application/wasm'
                                          : 'application/octet-stream';
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        return new Response(decompressedResponseArray,
                                            { headers: { 'content-type': contentType }
                                   });
                    })();
                }
            }
        });
    </script>

    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.8.0.11.js"></script>

    <script>
        function tickJS()
        {
            window.theInstance.invokeMethod('TickDotNet');
            window.requestAnimationFrame(tickJS);
        }

        window.initRenderJS = (instance) =>
        {
            window.theInstance = instance;

            // set initial canvas size
            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            canvas.width = holder.clientWidth;
            canvas.height = holder.clientHeight;
            // disable context menu on right click
            canvas.addEventListener("contextmenu", e => e.preventDefault());
            // ?vm=1 pie menu: KNI's Mouse.GetState misses synthetic/headless
            // clicks, so route canvas clicks through interop directly.
            canvas.addEventListener("click", (e) => {
                var r = canvas.getBoundingClientRect();
                try { instance.invokeMethod('CanvasClick', e.clientX - r.left, e.clientY - r.top); }
                catch (err) { /* game not constructed yet */ }
            });

            // begin game loop
            window.requestAnimationFrame(tickJS);
        };

        // Pie menu DOM overlay (?vm=1): the game raises OnPieMenu with real TTAB
        // options; clicking one sends a VMNetInteractionCmd into the shared VM.
        window.fsoPie = {
            el: null,
            show(callee, itemsJson, x, y) {
                this.hide();
                var items = JSON.parse(itemsJson);
                var el = document.createElement('div');
                el.id = 'fsoPieMenu';
                el.style.cssText = 'position:fixed;z-index:1000;background:#181c30;border:1px solid #4f6ef7;' +
                    'border-radius:8px;padding:4px;font:14px sans-serif;color:#cdd6ff;min-width:120px;' +
                    'left:' + Math.min(x, window.innerWidth - 160) + 'px;top:' + Math.min(y, window.innerHeight - 40 * items.length) + 'px;';
                items.forEach((it) => {
                    var b = document.createElement('div');
                    b.textContent = it.name;
                    b.style.cssText = 'padding:6px 10px;cursor:pointer;border-radius:5px;';
                    b.onmouseenter = () => b.style.background = '#4f6ef7';
                    b.onmouseleave = () => b.style.background = '';
                    b.onclick = () => { window.theInstance.invokeMethod('PieSelect', callee, it.id); this.hide(); };
                    el.appendChild(b);
                });
                document.body.appendChild(el);
                this.el = el;
            },
            hide() { if (this.el) { this.el.remove(); this.el = null; } },
        };

        // Build tag, bottom-right: run_browser_demo.sh substitutes the git rev
        // at publish time, so a stale served build is visible at a glance.
        // (Unsubstituted placeholder = not published through the demo script.)
        window.addEventListener('DOMContentLoaded', () => {
            var tag = document.createElement('div');
            tag.id = 'fsoBuildTag';
            tag.textContent = 'build __FSO_BUILD_REV__';
            tag.style.cssText = 'position:fixed;right:8px;bottom:6px;z-index:1100;' +
                'font:12px monospace;color:#8a94c8;background:rgba(24,28,48,0.8);' +
                'padding:2px 6px;border-radius:4px;pointer-events:none;';
            document.body.appendChild(tag);
        });

        // Boot status overlay: readable text for what the tab is doing (the
        // canvas status panel only draws placeholder bars — no font). Driven
        // from .NET each time the status changes; empty text hides it.
        window.fsoStatus = {
            el: null,
            set(text) {
                if (!text) { if (this.el) { this.el.remove(); this.el = null; } return; }
                if (!this.el) {
                    var el = document.createElement('div');
                    el.id = 'fsoStatus';
                    el.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);' +
                        'z-index:1100;background:rgba(24,28,48,0.92);border:1px solid #4f6ef7;border-radius:8px;' +
                        'padding:8px 16px;font:14px sans-serif;color:#cdd6ff;max-width:80%;text-align:center;';
                    document.body.appendChild(el);
                    this.el = el;
                }
                this.el.textContent = text;
            },
        };

        // Chat overlay (?vm=1): log + input, bottom-left. Lines come from the
        // shared VM's chat events; Enter sends a VMNetChatCmd.
        window.fsoChat = {
            box: null, log: null,
            init() {
                if (this.box) return;
                var box = document.createElement('div');
                box.id = 'fsoChat';
                box.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:900;width:320px;' +
                    'font:13px sans-serif;color:#cdd6ff;';
                var log = document.createElement('div');
                log.style.cssText = 'max-height:150px;overflow-y:auto;background:rgba(24,28,48,0.85);' +
                    'border-radius:8px 8px 0 0;padding:6px 8px;display:none;';
                var input = document.createElement('input');
                input.id = 'fsoChatInput';
                input.placeholder = 'chat…';
                input.style.cssText = 'width:100%;box-sizing:border-box;background:rgba(24,28,48,0.85);' +
                    'border:1px solid #4f6ef7;border-radius:0 0 8px 8px;color:#fff;padding:6px 8px;outline:none;';
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && input.value.trim()) {
                        window.theInstance.invokeMethod('ChatSend', input.value);
                        input.value = '';
                    }
                    e.stopPropagation();
                });
                box.appendChild(log); box.appendChild(input);
                document.body.appendChild(box);
                this.box = box; this.log = log;
            },
            push(line) {
                if (!this.box) this.init();
                this.log.style.display = 'block';
                var el = document.createElement('div');
                el.textContent = line;
                this.log.appendChild(el);
                this.log.scrollTop = this.log.scrollHeight;
            },
        };

        // Headless test hooks (Playwright): tile-space pie menu + interaction,
        // and tile→screen projection so tests can click the real canvas path.
        window.fsoDebug = {
            pie: (tx, ty) => window.theInstance.invokeMethod('DebugPie', tx, ty),
            screenPos: (tx, ty) => window.theInstance.invokeMethod('DebugScreenPos', tx, ty),
            interact: (callee, id) => window.theInstance.invokeMethod('PieSelect', callee, id),
        };

        window.addEventListener("keydown", function(event)
        {
            // Prevent Arrows Keys and Spacebar scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function(event)
        {
            // Prevent Mousewheel scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            event.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>
