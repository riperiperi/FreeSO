<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FreeSO Browser Client — Aries over WebSocket</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0f1220; color: #e6e8f0;
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #181c30; border: 1px solid #2a2f4a; border-radius: 14px;
    padding: 28px 32px; width: min(560px, 90vw);
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: #8b91b3; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  button {
    background: #4f6ef7; color: white; border: 0; border-radius: 8px;
    padding: 9px 18px; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #333a5c; cursor: default; }
  .status { font-size: 13px; padding: 3px 10px; border-radius: 999px; align-self: center; }
  .status.idle { background: #2a2f4a; color: #8b91b3; }
  .status.open { background: #123c26; color: #52d98b; }
  .status.closed { background: #3c1220; color: #f26d8d; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; }
  dt { color: #8b91b3; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  #handshake { display: none; margin-top: 4px; }
  #log {
    margin-top: 18px; padding: 10px 12px; background: #10131f; border-radius: 8px;
    font: 12px/1.6 ui-monospace, Menlo, monospace; color: #9aa0c0;
    max-height: 160px; overflow-y: auto; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="card">
  <h1>FreeSO in the browser</h1>
  <div class="sub">Aries protocol over a WebSocket bridge — no plugins, no TCP.</div>
  <div class="row">
    <button id="connect">Connect to city server</button>
    <span class="status idle" id="status">idle</span>
  </div>
  <dl id="handshake">
    <dt>Server</dt><dd id="f-name"></dd>
    <dt>Players online</dt><dd id="f-players"></dd>
    <dt>Version</dt><dd id="f-version"></dd>
    <dt>Shard</dt><dd id="f-shard"></dd>
    <dt>City map</dt><dd id="f-map"></dd>
  </dl>
  <div id="log"></div>
</div>

<script>
// Minimal Aries decoder. Framing per AriesProtocolEncoder.cs:
//   12-byte little-endian header: uint32 type, uint32 timestamp, uint32 payloadSize.
// Strings are PascalVLC (IoBufferUtils.PutPascalVLCString): LEB128 varint length + UTF-8.

const logEl = document.getElementById('log');
const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };

class ByteReader {
  constructor(bytes) { this.v = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength); this.o = 0; this.bytes = bytes; }
  u16() { const x = this.v.getUint16(this.o, true); this.o += 2; return x; }
  u32() { const x = this.v.getUint32(this.o, true); this.o += 4; return x; }
  i32() { const x = this.v.getInt32(this.o, true); this.o += 4; return x; }
  vlcString() {
    let len = 0, shift = 0, b;
    do { b = this.bytes[this.o++]; len |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
    const s = new TextDecoder().decode(this.bytes.subarray(this.o, this.o + len));
    this.o += len;
    return s;
  }
}

// Accumulates stream bytes and yields complete Aries frames.
class AriesFramer {
  constructor() { this.buf = new Uint8Array(0); }
  push(chunk) {
    const merged = new Uint8Array(this.buf.length + chunk.length);
    merged.set(this.buf); merged.set(chunk, this.buf.length);
    this.buf = merged;
    const frames = [];
    while (this.buf.length >= 12) {
      const v = new DataView(this.buf.buffer, this.buf.byteOffset);
      const size = v.getUint32(8, true);
      if (this.buf.length < 12 + size) break;
      frames.push({
        type: v.getUint32(0, true),
        payload: this.buf.subarray(12, 12 + size),
      });
      this.buf = this.buf.slice(12 + size);
    }
    return frames;
  }
}

function decodeArchiveHandshake(payload) {
  const r = new ByteReader(payload);
  return {
    name: r.vlcString(),
    playerCount: r.i32(),
    versionInfo: r.vlcString(),
    serverKey: r.vlcString(),
    nonce: r.vlcString(),
    archiveConfig: r.u16(),
    shardId: r.u32(),
    shardName: r.vlcString(),
    shardMap: r.vlcString(),
  };
}

const statusEl = document.getElementById('status');
function setStatus(cls, text) { statusEl.className = 'status ' + cls; statusEl.textContent = text; }

document.getElementById('connect').addEventListener('click', () => {
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/city';
  log('connecting ' + url);
  const ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  const framer = new AriesFramer();
  document.getElementById('connect').disabled = true;

  ws.onopen = () => { setStatus('open', 'socket open'); log('websocket open, waiting for server handshake'); };
  ws.onerror = () => log('websocket error');
  ws.onclose = (e) => {
    setStatus('closed', 'closed');
    document.getElementById('connect').disabled = false;
    log('closed (' + e.code + (e.reason ? ': ' + e.reason : '') + ')');
  };
  ws.onmessage = (e) => {
    for (const frame of framer.push(new Uint8Array(e.data))) {
      log('aries frame: type ' + frame.type + ', ' + frame.payload.length + ' bytes');
      if (frame.type === 2000) { // RequestClientSessionArchive
        const hs = decodeArchiveHandshake(frame.payload);
        document.getElementById('f-name').textContent = hs.name;
        document.getElementById('f-players').textContent = hs.playerCount;
        document.getElementById('f-version').textContent = hs.versionInfo;
        document.getElementById('f-shard').textContent = hs.shardName + ' (#' + hs.shardId + ')';
        document.getElementById('f-map').textContent = hs.shardMap;
        document.getElementById('handshake').style.display = 'grid';
        setStatus('open', 'handshake received');
        log('decoded RequestClientSessionArchive from "' + hs.name + '"');
      }
    }
  };
});
</script>
</body>
</html>
